version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: autopentest_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: autopentest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autopentest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autopentest_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AutoPentest AI
      - ENVIRONMENT=production
      - SECRET_KEY=super-secret-autopentest-ai-jwt-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/autopentest_db
      - CORS_ORIGINS=["http://localhost","http://localhost:80","http://localhost:5173","http://127.0.0.1:5173"]
    depends_on:
      db:
        condition: service_healthy

  # 3. React + Vite Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autopentest_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
